<!DOCTYPE html>
<html>
<head>
  <title>Bulk STK Push</title>
</head>
<body>
  <h2>Bulk STK Push (PesaFlux)</h2>

  <textarea id="numbers" rows="10" cols="40" placeholder="Enter numbers separated by comma or newline"></textarea><br><br>

  <input type="number" id="amount" placeholder="Amount"><br><br>
  <input type="text" id="reference" placeholder="Reference"><br><br>

  <button onclick="send()">Send STK</button>

  <pre id="output"></pre>

  <script>
    async function send() {
      const numbers = document.getElementById("numbers").value;
      const amount = document.getElementById("amount").value;
      const reference = document.getElementById("reference").value;

      const res = await fetch("/send-bulk", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ numbers, amount, reference })
      });

      const data = await res.json();
      document.getElementById("output").textContent =
        JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
